name: ItemVault Build

on:
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:

  build:
    runs-on: windows-2022

    env:
      Solution_Name: ItemVault

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Download Dalamud
      run: |
        Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
        Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

    - name: Build with dotnet
      run: dotnet build --configuration Release

    - name: Store artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ItemVault
        path: .\ItemVault\bin\x64\Release\ItemVault\*
        if-no-files-found: error
        retention-days: 1

    - name: Upload to release
      if: github.event_name == 'release'
      run: |
        Compress-Archive -Path .\ItemVault\bin\x64\Release\ItemVault\* -DestinationPath latest.zip
        gh release upload ${{ github.event.release.tag_name }} latest.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
